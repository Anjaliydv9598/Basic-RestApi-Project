<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Beautiful Sign Up</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

/* Background */
body{
    height:100vh;
    display:flex;
    background:#0f172a;
}

/* Left Panel */
.left{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    background: linear-gradient(135deg,#00c6ff,#0072ff);
}

.left h1{
    font-size:45px;
    margin-bottom:10px;
}

.left p{
    opacity:0.8;
}

/* Right Panel */
.right{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Card with glowing border */
.card{
    position:relative;
    width:350px;
    padding:40px;
    border-radius:20px;
    background:#111827;
    text-align:center;
    color:white;
    z-index:1;
}

/* Glow Border Effect */
.card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:20px;
    background:linear-gradient(45deg,#00ffff,#ff00ff,#00ffff);
    z-index:-1;
    filter:blur(10px);
    opacity:0.7;
}

/* Heading */
.card h2{
    margin-bottom:25px;
}

/* Inputs */
.input-box{
    margin:20px 0;
}

.input-box input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
    outline:none;
    transition:0.3s;
}

.input-box input:focus{
    box-shadow:0 0 10px #00ffff;
}

/* Button */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:25px;
    background:linear-gradient(45deg,#00ffff,#0072ff);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.06);
    box-shadow:0 0 20px #00ffff;
}

/* Link */
p{
    margin-top:15px;
}

a{
    color:#00ffff;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="left">
    <h1>JOIN US 🚀</h1>
    <p>Create your future today</p>
</div>

<div class="right">
    <div class="card">
        <h2>Sign Up</h2>

        <div class="input-box">
            <input type="text" placeholder="Full Name">
        </div>

        <div class="input-box">
            <input type="email" placeholder="Email">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
        </div>

        <button>Create Account</button>

        <p>Already have an account? <a href="logIn.html">Login</a></p>
    </div>
</div>

</body>
</html>
