<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simple Hello World Webpage">
    <title>Hello World</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #1f1c2c, #928dab);
            font-family: Arial, sans-serif;
        }

        .container{
            background-color: white;
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1{
            font-size: 3rem;
            color: #333;
            letter-spacing: 2px;
        }

        p{
            margin-top: 10px;
            color: #666;
            font-size: 1rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>HELLO WORLD</h1>
        <p>Welcome to my first web page 🚀</p>
    </div>

</body>
</html>
