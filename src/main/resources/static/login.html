<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Futuristic Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* Background */
body{
    height:100vh;
    display:flex;
    background: linear-gradient(135deg,#141e30,#243b55);
}

/* Left Side */
.left{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    flex-direction:column;
    background: radial-gradient(circle at top,#00c6ff,#0072ff);
}

.left h1{
    font-size:40px;
    margin-bottom:10px;
}

.left p{
    opacity:0.8;
}

/* Right Side (Form) */
.right{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Form Card */
.container{
    width:320px;
    padding:40px;
    border-radius:20px;
    background:#111;
    box-shadow:0 0 25px rgba(0,255,255,0.4);
    text-align:center;
    color:white;
}

/* Title */
.container h2{
    margin-bottom:25px;
}

/* Inputs */
.input-box{
    margin:20px 0;
}

.input-box input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1c1c1c;
    color:white;
    outline:none;
    transition:0.3s;
}

.input-box input:focus{
    box-shadow:0 0 10px #00ffff;
}

/* Button */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:25px;
    background:linear-gradient(45deg,#00ffff,#0072ff);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #00ffff;
}

/* Link */
p{
    margin-top:15px;
}

a{
    color:#00ffff;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="left">
    <h1>HELLO USERS ! 👨‍💻</h1>
    <p>Build • Code • Create</p>
</div>

<div class="right">
    <div class="container">
        <h2>Login</h2>

        <div class="input-box">
            <input type="email" placeholder="Email">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
        </div>

        <button>Login</button>

        <p>Don't have an account? <a href="signUp.html">Sign Up</a></p>
    </div>
</div>

</body>
</html>
