<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffb6f9, #c084fc);
        }

        .login-container{
            width: 350px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-container h1{
            color: white;
            margin-bottom: 25px;
            font-size: 32px;
        }

        .input-box{
            margin: 18px 0;
        }

        .input-box input{
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255,255,255,0.8);
        }

        .input-box input::placeholder{
            color: #7b2cbf;
        }

        .login-btn{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff66c4, #9d4edd);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover{
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .extra-links{
            margin-top: 18px;
            color: white;
            font-size: 14px;
        }

        .extra-links a{
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        .extra-links a:hover{
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>Welcome 💜</h1>

        <form>
            <div class="input-box">
                <input type="email" placeholder="Enter Email" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <div class="extra-links">
                <p>Forgot Password? <a href="#">Click Here</a></p>
                <p style="margin-top:8px;">
                    Don't have an account? <a href="#">Sign Up</a>
                </p>
            </div>
        </form>
    </div>

</body>
</html>
